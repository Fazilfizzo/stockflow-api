app.upload.dir=uploads

spring.application.name=stockflow-api
server.port=5670
spring.datasource.url=jdbc:mysql://localhost:3306/stock_flow_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format.sql=true

logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger - %msg%n


jwt.secret=${JWT_SECRET}
jwt.expiration=900000

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.authorities=true
spring.mail.properties.mail.smtp.starttls.enable=true

default.from=${EMAIL_USERNAME}
default.origin=${FRONTEND_ORIGIN}
default.localhost=${IMAGE}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

stripe.secret-key=${STRIPE_SECRET_KEY}
